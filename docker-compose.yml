# docker compose --profile demo up --build     (small image, no data, no key; http://localhost:8000/docs)
# docker compose --profile live up --build     (needs .env with GEMINI_API_KEY, and ./data and ./models on this machine)
services:
  demo:
    profiles: ["demo"]
    build: {context: ., target: demo}
    image: traceguard:demo
    ports: ["8000:8000"]
    read_only: true

  live:
    profiles: ["live"]
    build: {context: ., target: live}
    image: traceguard:live
    ports: ["8001:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      TRACEGUARD_MODE: live
      TRACEGUARD_DAILY_LLM_BUDGET: ${TRACEGUARD_DAILY_LLM_BUDGET:-400}
      TRACEGUARD_RATE_LIMIT_PER_HOUR: ${TRACEGUARD_RATE_LIMIT_PER_HOUR:-6}
      TRACEGUARD_REQUEST_TIMEOUT_S: ${TRACEGUARD_REQUEST_TIMEOUT_S:-240}
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - hf_cache:/hf_cache

volumes:
  hf_cache:
